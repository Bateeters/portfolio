<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brian Teeters Portfolio</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/cards.css">
</head>
<body>
  <div class="container">
    <div class="row justify-content-center align-content-center min-height-100">
      <div class="col-lg-10 col-md-12">
        <div class="grid-container">
          <div class="m-2 p-4 card projects-card">Projects</div>
          <div class="m-2 p-4 card profile-card">Profile Status</div>
          <div class="m-2 p-4 card dev-card">
            <h3>Dev Activity</h3>
            <img class="github-img"
              src="https://ghchart.rshah.org/Bateeters"
              alt="GitHub contribution activity"
            />
          </div>
          <div class="m-2 p-4 card skills-card">Skills / Tooling</div>
          <div class="m-2 p-4 card resume-card">Resume</div>
          <div class="m-2 p-4 card ui-card">UI Work</div>
          <div class="m-2 p-4 card contact-card">Contact Me</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
